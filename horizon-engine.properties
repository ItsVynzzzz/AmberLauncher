# Mesin Rust Amber: Starling (penerus Horizon Android, MIT). Di Amber muncul sebagai loader "Starling".
# Nama berkas dipertahankan karena workflow membacanya. Cara kerjanya: docs/rust-engine.md.

# Sumber resmi, dipatok ke satu commit (40 digit). Ini v0.9.0 (Minecraft 26.3). Periksa diff-nya sebelum mengganti.
source_repo=https://github.com/starling-client/starling
commit=ff303502a4f7982551a0e0d3622d9268efe9e829

# fast = profil yang dipakai rilis resmi Starling. release (ThinLTO) jauh lebih lama dan boros RAM.
profile=fast

# Perubahan Amber pada sumber (third_party/horizon-patches/<nama>): kelas Java milik Amber, data di files/starling,
# sidebar, makro, dan editor Kontrol Amber, simpan dunia saat keluar, pembaruan bawaan Starling dimatikan.
patch_set=amber6
ndk=28.2.13676358
release_repo=ItsVynzzzz/AmberLauncher

# Dinaikkan bila skrip build berubah tanpa mengubah commit atau patch, supaya mesin dibangun ulang.
revision=1

# Mod native (bonus): bundelnya dari fork lama, dikompilasi ke dalam pustaka mesin. Mod yang gagal dikompilasi dibuang
# sendiri oleh build; mesinnya tetap terbit. Belum diuji terhadap 0.9.0.
# Tidak dimasukkan: basic_hud, punchy, visuality_horizon (titik sambungnya sudah tidak ada di 0.9.0), serta
# veinminer appleskin rightharvest customhud carryblock (arsipnya tanpa lisensi). Kosongkan native_mods= untuk tanpa mod.
mods_repo=https://github.com/CihuyAkz/starling-extras
mods_commit=32961a037f4127904262ab651f08d73a1d262a84
native_mods=zoom recipes smartf3 freecam_plus connected_textures armorhud jade freelook cinematic_interactions firstpersonmodel eatinganimation liteminer
