# Mesin Rust (Horizon). Panduan lengkap: docs/rust-engine.md
#
# Mesin dikompilasi dari SUMBER oleh workflow "Bangun mesin Rust (Horizon)" pada commit yang dipatok di sini,
# diterbitkan sebagai Release di repo ini, lalu dipasang otomatis ke APK oleh build (scripts/fetch-horizon-engine.sh).
# Mengganti versi mesin = mengganti commit= lalu menjalankan workflow itu sekali.
# Variabel lingkungan HORIZON_ENGINE_* menang atas isi berkas ini. Kosongkan commit= untuk build tanpa mesin Rust.

# Sumber mesin: port Android proyek Horizon (MIT) dan commit yang diperiksa dan dipatok (40 digit).
source_repo=https://github.com/Vasysik/horizon-android
commit=844ef35f2b14e3fed99d5d2e05b274193fae4388

# release = optimasi penuh (ThinLTO, kompilasi lambat). fast = tanpa LTO, lebih cepat dan hemat RAM (untuk mencoba).
profile=release

# Versi NDK Android yang dipakai proyek sumber.
ndk=28.2.13676358

# Repo tempat Release mesin dicari bila build berjalan di luar GitHub Actions (di Actions dipakai repo yang membangun).
release_repo=ItsVynzzzz/AmberLauncher
