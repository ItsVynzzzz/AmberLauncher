name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Ambil kode
        uses: actions/checkout@v5

      - name: Periksa keaslian Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi dan pasang platform SDK 37 (Android SDK sudah ada di runner)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37" || echo "Platform 37 tidak terpasang manual, Gradle akan mengunduh sendiri"

      - name: Siapkan kunci tanda tangan rilis (dari Secrets)
        env:
          AMBER_KEYSTORE_BASE64: ${{ secrets.AMBER_KEYSTORE_BASE64 }}
          AMBER_KEYSTORE_PASSWORD: ${{ secrets.AMBER_KEYSTORE_PASSWORD }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          if [ -n "$AMBER_KEYSTORE_BASE64" ] && [ -n "$AMBER_KEYSTORE_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/amber-release.p12"
            printf '%s' "$AMBER_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            PASS="$(printf '%s' "$AMBER_KEYSTORE_PASSWORD" | tr -d ' \r\n')"
            if ! keytool -list -v -keystore "$KEYSTORE_PATH" -storetype PKCS12 -storepass "$PASS" -alias amber > "$RUNNER_TEMP/keytool.txt" 2>&1; then
              echo "::error::Kunci rilis tidak bisa dibuka. Periksa isi Secrets AMBER_KEYSTORE_BASE64 dan AMBER_KEYSTORE_PASSWORD (harus persis sama dengan isi file yang diberikan)."
              exit 1
            fi
            echo "Kunci rilis terpasang. Sidik jari sertifikat:"
            grep -E "SHA256:" "$RUNNER_TEMP/keytool.txt" || true
            rm -f "$RUNNER_TEMP/keytool.txt"
            echo "AMBER_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          elif [ "$IS_FORK" = "true" ]; then
            echo "Kunci rilis tidak ada (wajar untuk fork). APK ditandatangani kunci debug."
          else
            echo "::error::Kunci tanda tangan rilis belum dipasang. Isi Secrets AMBER_KEYSTORE_BASE64 dan AMBER_KEYSTORE_PASSWORD di Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Terapkan patch pending-*.patch (jika ada)
        id: patch
        run: |
          shopt -s nullglob
          PATCHES=(pending-*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "Tidak ada patch, build seperti biasa."
            exit 0
          fi
          TOTAL=0
          for f in "${PATCHES[@]}"; do
            LAST=$(tail -n 1 "$f")
            PARTS=$(echo "$LAST" | sed -n 's/^# FIN part=[0-9]*\/\([0-9][0-9]*\) files=[0-9][0-9]*$/\1/p')
            EXPECT=$(echo "$LAST" | sed -n 's/^# FIN part=[0-9]*\/[0-9]* files=\([0-9][0-9]*\)$/\1/p')
            ACTUAL=$(grep -c '^diff --git ' "$f" || true)
            echo "Memeriksa $f ($(wc -c < "$f") byte, $ACTUAL file)"
            if [ -z "$EXPECT" ] || [ "$EXPECT" != "$ACTUAL" ]; then
              echo "::error::$f terpotong atau rusak saat diupload (penanda akhir tidak ditemukan). Upload ulang file aslinya."
              exit 1
            fi
            if [ "$PARTS" != "${#PATCHES[@]}" ]; then
              echo "::error::Ada ${#PATCHES[@]} file pending-*.patch di repo, seharusnya $PARTS. Upload semua bagian sekaligus."
              exit 1
            fi
            TOTAL=$((TOTAL + ACTUAL))
          done
          for f in "${PATCHES[@]}"; do
            echo "Menerapkan $f ..."
            if ! git apply --index --whitespace=nowarn "$f"; then
              echo "::error::Gagal menerapkan $f."
              exit 1
            fi
          done
          CHANGED=$(git diff --cached --name-only | wc -l)
          if [ "$CHANGED" != "$TOTAL" ]; then
            echo "::error::Jumlah file berubah ($CHANGED) tidak sama dengan isi patch ($TOTAL)."
            exit 1
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Pasang Gradle dan cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK release
        env:
          AMBER_KEYSTORE_PASSWORD: ${{ secrets.AMBER_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Siapkan file APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/MyLauncher-build${{ github.run_number }}.apk"
          ls -lh dist
          APKSIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Sidik jari tanda tangan APK:"
            "$APKSIGNER" verify --print-certs "dist/MyLauncher-build${{ github.run_number }}.apk" | grep -i "SHA-256" || true
          fi

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-build${{ github.run_number }}
          path: dist/*.apk
          retention-days: 14

      - name: Buat Release agar APK bisa diunduh langsung dari HP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          if ! gh release create "$TAG" dist/*.apk --title "Build ${{ github.run_number }}" --notes "APK build nomor ${{ github.run_number }}." --prerelease; then
            # Bila dijalankan ulang dan rilisnya sudah ada, cukup timpa berkas APK-nya
            gh release upload "$TAG" dist/*.apk --clobber
          fi

      - name: Simpan perubahan patch ke repo (hanya jika build lolos)
        if: steps.patch.outputs.applied == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git ls-files 'pending*.patch' | xargs -r git rm -q -f
          git commit -m "Terapkan patch (build lolos)"
          git push
