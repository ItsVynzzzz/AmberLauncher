# Mesin Rust (Horizon). Panduan lengkap: docs/rust-engine.md
#
# Mesin dikompilasi dari SUMBER oleh workflow "Bangun mesin Rust (Horizon)" pada commit yang dipatok di sini,
# diterbitkan sebagai Release di repo ini, lalu dipasang otomatis ke APK oleh build (scripts/fetch-horizon-engine.sh).
# Mengganti versi mesin = mengganti commit= lalu menjalankan workflow itu sekali.
# Variabel lingkungan HORIZON_ENGINE_* menang atas isi berkas ini. Kosongkan commit= untuk build tanpa mesin Rust.

# Sumber mesin: port Android proyek Horizon (MIT; sekarang di repo Starling, cabang android) dan commit yang diperiksa
# dan dipatok (40 digit). Commit ini = rilis Horizon Android 0.7.8.
source_repo=https://github.com/starling-client/starling
commit=68a2c4dd1b9a9e511ad3758a79ab772b6f9e5b29

# release = optimasi penuh (ThinLTO, kompilasi lambat). fast = tanpa LTO, lebih cepat dan hemat RAM (untuk mencoba).
profile=release

# Versi NDK Android yang dipakai proyek sumber.
ndk=28.2.13676358

# Perubahan kecil milik AmberLauncher pada sumber mesin, diterapkan sebelum kompilasi: mesin membaca akun dari
# Amber (offline atau Microsoft), langsung bermain, dan kembali ke Amber saat game ditutup.
# Berkasnya ada di third_party/horizon-patches/<nilai ini>/. Tag Release mesin memuat nilai ini DAN hash isi berkasnya
# (horizon-engine-<12 digit commit>-<nilai ini>-<hash>), jadi mengedit patch otomatis berarti mesin baru: build APK
# berikutnya membangunnya sendiri, tanpa menjalankan workflow terpisah.
# Kosongkan untuk mesin tanpa perubahan. Hanya huruf kecil dan angka, paling banyak 20 karakter.
patch_set=amber3

# Repo tempat Release mesin dicari bila build berjalan di luar GitHub Actions (di Actions dipakai repo yang membangun).
release_repo=ItsVynzzzz/AmberLauncher
